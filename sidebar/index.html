<!doctype html>
<html lang="de">
<head><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="utf-8">
  <title>Edu-Sharing</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- First of everything, and not a module (those are deferred): it stamps the theme the panel last
       ran in onto <html>, so a dark panel does not flash white before ThemeService has read the
       setting out of extension storage. -->
  <script src="theme-boot.js"></script>
  <!-- Material Icons for the embedded edu-sharing / wlo web components: their stylesheets style
       `.material-icons` / `.material-icons-outlined` but ship no font. Loaded from Google, which
       the extension CSP allows (style-src fonts.googleapis.com, font-src fonts.gstatic.com). -->
  <style>@font-face{font-family:'Material Icons';font-style:normal;font-weight:400;src:url(https://fonts.gstatic.com/s/materialicons/v145/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2) format('woff2');}@font-face{font-family:'Material Icons Outlined';font-style:normal;font-weight:400;src:url(https://fonts.gstatic.com/s/materialiconsoutlined/v110/gok-H7zzDkdnRel8-DQ6KAXJ69wP1tGnf4ZGhUce.woff2) format('woff2');}.material-icons{font-family:'Material Icons';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;}.material-icons-outlined{font-family:'Material Icons Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;}</style>
  <!-- Material Symbols for the panel's own icons (esIcon): the legacy font above is frozen and lacks
       some of the motifs the menu uses (add_notes, quick_reference). Same hosts, so the same CSP
       entries cover it. -->
  <style>@font-face{font-family:'Material Symbols Outlined';font-style:normal;font-weight:400;src:url(https://fonts.gstatic.com/s/materialsymbolsoutlined/v367/kJF1BvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oDMzByHX9rA6RzaxHMPdY43zj-jCxv3fzvRNU22ZXGJpEpjC_1v-p_4MrImHCIJIZrDCvHOej.woff2) format('woff2');}.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;}</style>
<link rel="stylesheet" href="styles.css"></head>
<body>
  <es-root></es-root>
<script src="main.js" type="module"></script></body>
</html>
