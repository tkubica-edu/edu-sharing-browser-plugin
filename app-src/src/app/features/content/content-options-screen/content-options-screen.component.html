<div class="es-screen-body">
  <!-- The same card the main menu shows, under the name this screen gives it: there it is the way in,
       here it says which content the options below act on. -->
  <es-content-card heading="Gewählter Inhalt">
    <es-details-link></es-details-link>
  </es-content-card>

  <!-- The same rows as the main menu: these are a choice of next step, not form buttons. A step that a
       later state unlocks stays listed and disabled, and its line says what is missing — the same way
       the main menu treats a section that does not apply yet. -->
  <ul class="option-list">
    @for (option of options(); track option.label) {
      <li>
        <button class="menu-item" [disabled]="flow.deciding() || !!option.disabled"
                (click)="option.run()">
          <i class="mi-icon" [esIcon]="option.icon"></i>
          <span class="mi-main">
            <span class="mi-title">{{ option.label }}</span>
            <span class="mi-desc">{{ option.hint ?? option.description }}</span>
          </span>
          <i class="chevron" esIcon="chevron_right"></i>
        </button>
      </li>
    }
  </ul>

  @if (flow.deciding()) {
    <p class="es-muted">Der Inhalt wird geprüft …</p>
  }
</div>
