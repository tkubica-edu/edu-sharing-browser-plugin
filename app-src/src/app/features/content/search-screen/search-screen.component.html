<!-- Login required to search the repository — reuse the shared gate. -->
@if (auth.authorized()) {
  <div class="nodes-wrap">
    <es-nodes-selector
      [option]="option"
      [tabBlacklist]="hiddenTabs"
      [primaryMode]="'activity'"
      [allowCollectionSelection]="true"
      errorLabel="Suche konnte nicht geladen werden"
    ></es-nodes-selector>
  </div>
} @else {
  <es-login-gate></es-login-gate>
}
