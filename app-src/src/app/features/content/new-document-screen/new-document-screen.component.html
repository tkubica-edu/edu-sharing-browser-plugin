<!-- Login required to create a document in the repository — reuse the shared gate. -->
@if (auth.authorized()) {
  <div class="connector-wrap">
    @if (error() || bundle.error(); as message) {
      <p class="es-error">{{ message }}</p>
    }

    @if (bundle.ready()) {
      <!-- Mounting the element opens the OnlyOffice create-dialog immediately. -->
      <edu-sharing-add-with-connector
        connector-id="ONLY_OFFICE"
        parent="-userhome-"
        name="Neues Dokument"
        (nodeCreated)="onNodeCreated($event)"
        (dialogClosed)="onDialogClosed($event)"
        (failed)="onFailed($event)"
      ></edu-sharing-add-with-connector>
    } @else if (!bundle.error()) {
      <p class="es-muted">OnlyOffice-Dialog wird geladen …</p>
    }
  </div>
} @else {
  <es-login-gate></es-login-gate>
}
