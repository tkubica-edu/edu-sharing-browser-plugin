<!-- Nothing while the bundle is still loading: the offer is an aside, and an aside does not report
     that it is on its way. The element itself brings the card, its title and the copy control. -->
@if (link(); as url) {
  @if (bundle.ready()) {
    <edu-sharing-share-qr variant="compact" [link]="url" [size]="qrSize"
                          hint-label="QR-Code scannen oder Link kopieren"></edu-sharing-share-qr>
  }
}
