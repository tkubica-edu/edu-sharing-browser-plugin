<div class="es-screen-body">
  <!-- The two processes are options of one choice, so each card is its radio's label: the whole of the
       card marks it, and the way on in the footer opens whichever is marked. -->
  <ul class="choice-list">
    @for (option of options(); track option.section) {
      <li>
        <label class="es-card choice" [class.is-selected]="isSelected(option)">
          <input type="radio" name="es-flow-choice" [checked]="isSelected(option)"
                 (change)="select(option)" />
          <span class="choice-body">
            <span class="choice-label">{{ option.label }}</span>
            <span class="choice-description es-muted">{{ option.description }}</span>
          </span>
        </label>
      </li>
    }
  </ul>
</div>
