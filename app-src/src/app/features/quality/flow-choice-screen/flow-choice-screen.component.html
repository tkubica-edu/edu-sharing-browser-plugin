<div class="es-screen-body">
  <!-- Each option is a card that can be marked, with the button that starts it inside. The card is
       the control, so the whole of it is clickable; the button inside it does both at once. -->
  <ul class="choice-list">
    @for (option of options(); track option.section) {
      <li>
        <div class="es-card choice" [class.is-selected]="isSelected(option)">
          <button type="button" class="choice-body" [attr.aria-pressed]="isSelected(option)"
                  (click)="select(option)">
            <h2>{{ option.label }}</h2>
            <p class="es-muted">{{ option.description }}</p>
          </button>
          <button type="button" class="es-btn es-btn--primary" (click)="start(option.section)">
            {{ option.action }}
          </button>
        </div>
      </li>
    }
  </ul>
</div>
