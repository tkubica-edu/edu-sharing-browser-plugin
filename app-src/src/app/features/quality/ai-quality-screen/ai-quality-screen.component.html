<!-- Said before the dialogue rather than inside it: without a collection the assistant has no requirements to
     check the content against, which is what this step is for. -->
@if (!collection()) {
  <p class="es-muted no-collection">
    Für diesen Inhalt ist keine Sammlung gewählt — die KI kann ihn nur allgemein beurteilen, nicht
    anhand der Anforderungen einer Sammlung.
  </p>
}

@if (problem()) {
  <p class="es-error problem">{{ problem() }}</p>
}

<!-- The assistant's chat, about the content instead of about the open tab, with the criteria as its task and
     as the shape of its answer (see the component). Held back until the criteria are settled: the chat reads
     both as it mounts, and it mounts once.

     What it answers is not drawn a second time beside it, and neither is where the check stands — the dialogue
     is what the person reads, and it is what greets them, asks whose content this is, and walks them through
     the steps and their confirmations. The verdicts go to the console and into the record; see
     AiQualityScreenComponent.take. -->
@if (settled()) {
  <es-ai-assistant-screen
    class="chat"
    [context]="context()"
    [task]="task()"
    [resultSchema]="resultSchema()"
    [quickReplies]="quickReplies()"
    [quickRepliesMax]="quickRepliesMax()"
    (agentResult)="take($event)"
  ></es-ai-assistant-screen>
} @else {
  <p class="es-muted no-collection">Die Qualitätskriterien werden geladen …</p>
}
