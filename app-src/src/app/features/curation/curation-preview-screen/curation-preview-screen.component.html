<div class="es-screen-body">
  <!-- The view group renders both the picture and the title. `form` mode while the content is only a
       stand-in, because there is no node a widget could write to or the repository could be asked
       about; the node mode once this step has created it (see EDITOR_MODE_FOR_DRAFT). -->
  @if (editorNode; as node) {
    <section class="es-card preview-card">
      <es-mds-preview-widget [node]="node" [metadata]="draftMetadata" [editorMode]="editorMode"
                             [locked]="curation.metadataLocked()"
                             (valuesChange)="onValuesChange($event)"></es-mds-preview-widget>
    </section>
  } @else {
    <section class="es-card">
      <p class="es-muted">Es liegt kein erschlossener Inhalt vor.</p>
    </section>
  }

  <!-- The way on writes the content, so a refused write is reported here — the step it would have
       led to is not entered (see ActionBarService). -->
  @if (curation.saveError(); as error) {
    <section class="es-card"><p class="es-error">Speichern fehlgeschlagen: {{ error }}</p></section>
  }
</div>
