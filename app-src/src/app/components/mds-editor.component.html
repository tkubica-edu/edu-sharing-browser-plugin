<div class="mds-wrap">
  @if (bundle.error()) {
    <p class="es-error">Editor konnte nicht geladen werden: {{ bundle.error() }}</p>
  } @else if (!ready()) {
    <p class="es-muted">Editor wird geladen…</p>
  }

  <!--
    <edu-sharing-mds-editor-wrapper> is created imperatively (see mount()) instead of used as a
    template tag: as an @angular/elements custom element its ngOnInit runs on connect
    (appendChild) and THROWS unless `embedded`/`currentValues` are already set. Template
    property bindings are applied only AFTER connect, so they would be too late.
  -->
  <div #host class="mds-host"></div>
</div>
