<div class="mds-wrap">
  @if (bundle.error()) {
    <p class="es-error">Editor konnte nicht geladen werden: {{ bundle.error() }}</p>
  } @else if (!ready()) {
    <p class="es-muted">Editor wird geladen…</p>
  }

  <!--
    <edu-sharing-mds-editor-wrapper> is created imperatively into #host rather than used as a
    template tag, because its inputs must be set as properties before it connects — see mount()
    and the component comment.
  -->
  <div #host class="mds-host"></div>
</div>
