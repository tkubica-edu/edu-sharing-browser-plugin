@if (curation.activeNode(); as node) {
  <a class="details-link" [href]="node.link" target="_blank" rel="noopener noreferrer">
    Alle Details anzeigen
    <!-- The arrow out of the box says the link leaves the panel — drawn here rather than taken from
         the icon font, so it is the same size as the text it follows. -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7 17L17 7" /><path d="M9 7h8v8" />
    </svg>
  </a>
}
