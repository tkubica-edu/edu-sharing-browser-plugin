@if (bundle.error()) {
  <p class="es-error">{{ errorLabel() }}: {{ bundle.error() }}</p>
}

<!--
  The @if is required, not cosmetic (see the component comment): inside a conditional block the
  element's DOM node is created detached, bound, and only then inserted — so `option` is already
  set when connectedCallback upgrades the element.
-->
@if (selectorOption(); as option) {
  <edu-sharing-nodes-selector
    [option]="option"
    [tabBlacklist]="tabBlacklist()"
    [primaryMode]="primaryMode()"
  ></edu-sharing-nodes-selector>
}
