<section class="es-card">
  <label class="es-field-label" for="repo-url">Repository-URL <span class="es-req">*</span></label>
  <input id="repo-url" type="url" class="es-input" placeholder="https://…/edu-sharing"
         [class.invalid]="missingUrl()"
         [ngModel]="repositoryUrl()" (ngModelChange)="apply($event)" />

  @if (missingUrl()) {
    <p class="es-hint">Die Repository-URL ist erforderlich.</p>
  }

  <p class="desc">Basis-URL des edu-sharing Repositoriums. Wird für die Anmeldung verwendet.</p>

  @if (auth.needsReload()) {
    <div class="es-notice">
      <span>Repository geändert. Zum Übernehmen neu laden.</span>
      <button class="es-btn es-btn--tonal es-btn--small" (click)="reload()">Übernehmen</button>
    </div>
  }

  <div class="es-row">
    <button class="es-btn es-btn--text" (click)="resetToDefault()">Auf Standard zurücksetzen</button>
  </div>
</section>
