<div class="es-screen-body">
  <!-- The view group renders both the picture and the title; `form` mode, because the draft has no
       node behind it — neither one a widget could write to on its own, nor one the repository could
       be asked about (see EDITOR_MODE_FOR_DRAFT). -->
  @if (draftNode; as node) {
    <section class="es-card preview-card">
      <es-mds-preview-widget [node]="node" [metadata]="draftMetadata" [editorMode]="editorMode"
                             (valuesChange)="onValuesChange($event)"></es-mds-preview-widget>
    </section>
  } @else {
    <section class="es-card">
      <p class="es-muted">Es liegt kein erschlossener Inhalt vor.</p>
    </section>
  }
</div>
