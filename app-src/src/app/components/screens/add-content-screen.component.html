<div class="es-screen-body">
  <section class="es-hint-card">
    <p class="es-muted">
      Wähle, wie der Inhalt hinzugefügt werden soll. Ein neu erstellter Inhalt wird direkt im
      Connector geöffnet und kann dort bearbeitet werden.
    </p>
  </section>

  <!-- The main menu's rows, one level down — same class names as the `menu-rows` mixin expects. -->
  <ul class="add-list">
    @for (option of options(); track option.section) {
      <li>
        <button class="menu-item" (click)="navigation.go(option.section)">
          @if (icons.material(option.section); as glyph) {
            <i class="mi-icon" [esIcon]="glyph"></i>
          } @else {
            <span class="mi-icon" [innerHTML]="icons.icon(option.section)"></span>
          }
          <span class="mi-main">
            <span class="mi-title">{{ option.label }}</span>
            <span class="mi-desc">{{ option.description }}</span>
          </span>
          <i class="chevron" esIcon="chevron_right"></i>
        </button>
      </li>
    }
  </ul>
</div>
