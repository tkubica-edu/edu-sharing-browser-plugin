<div class="es-screen-body">
  <section class="es-hint-card">
    @if (curation.activeNode(); as node) {
      <p class="es-muted">Node: <strong>{{ node.name ?? node.nodeId }}</strong></p>
      <a class="upload-link" [href]="node.link" target="_blank" rel="noopener noreferrer">Node öffnen</a>
    } @else {
      <p class="es-muted">Noch kein Node vorhanden.</p>
    }
  </section>

  <!-- The WLO canvas shows the saved properties read-only while the repository config enables it;
       otherwise the edu-sharing preview element renders the node itself. -->
  @if (additionalWebComponent.enabled()) {
    @if (curation.editorMetadata(); as metadata) {
      <section class="es-card">
        <es-wlo-canvas mode="detail" [metadata]="metadata"></es-wlo-canvas>
      </section>
    }
  } @else if (curation.previewNode(); as node) {
    <section class="es-card">
      <es-preview-node [node]="node"></es-preview-node>
    </section>
  }
</div>
