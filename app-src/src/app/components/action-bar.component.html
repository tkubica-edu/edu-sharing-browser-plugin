@if (actionBar.actions().length) {
  <footer class="action-bar">
    @for (action of actionBar.actions(); track action.label) {
      <button class="fbtn" [class.fbtn-primary]="action.kind !== 'secondary'"
              [class.fbtn-secondary]="action.kind === 'secondary'"
              [disabled]="action.disabled" (click)="action.run()">
        <span>{{ action.label }}</span>
      </button>
    }
  </footer>
}
