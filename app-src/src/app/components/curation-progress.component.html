<!-- One label for the whole scene: the parts are decoration, and a screen reader gets the caption
     below as live text instead of a pile of empty spans. -->
<div
  class="cp-scene"
  role="img"
  aria-label="Bilder und Texte der Webseite werden gesammelt und anschließend von der KI bewertet"
>
  <!-- The page being read: a screenshot tile, its text lines, and the sweep going over them. -->
  <div class="cp-page">
    <span class="cp-page-shot"></span>
    <span class="cp-page-line"></span>
    <span class="cp-page-line"></span>
    <span class="cp-page-line cp-page-line--short"></span>
    <span class="cp-sweep"></span>
  </div>

  <!-- What is picked off the page, on its way over. -->
  <div class="cp-flight">
    <span class="cp-item cp-item--shot cp-item--1"></span>
    <span class="cp-item cp-item--text cp-item--2"></span>
    <span class="cp-item cp-item--shot cp-item--3"></span>
    <span class="cp-item cp-item--text cp-item--4"></span>
  </div>

  <!-- The cart it lands in, and the AI that goes over what is in it. -->
  <div class="cp-cart">
    <svg viewBox="0 0 32 30" aria-hidden="true">
      <path
        d="M1 3h4.2l4 16.2h16.6M8.6 14.4h16.1l3.3-8.6H6.6"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="12.5" cy="26" r="2.4" fill="currentColor" />
      <circle cx="23.5" cy="26" r="2.4" fill="currentColor" />
    </svg>
    <span class="cp-load">
      <span class="cp-load-bar cp-load-bar--1"></span>
      <span class="cp-load-bar cp-load-bar--2"></span>
      <span class="cp-load-bar cp-load-bar--3"></span>
    </span>
    <span class="cp-ai">KI</span>
  </div>
</div>

<!-- The three phases, cross-faded by the same cycle as the scene. `aria-live` so the phase is
     announced as text; the stack keeps them on one line so nothing below moves. -->
<p class="cp-caption" aria-live="polite">
  <span class="cp-phase cp-phase--1">Die Seite wird gelesen …</span>
  <span class="cp-phase cp-phase--2">Bilder und Texte werden gesammelt …</span>
  <span class="cp-phase cp-phase--3">Die KI bewertet die Inhalte …</span>
</p>
