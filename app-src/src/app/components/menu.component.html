<div class="menu">
  <!-- The panel's centre as its own group: a heading, and a card showing the content — its picture and
       title, or what the recognition reports instead (see AppSection.focal). -->
  @for (section of focalSections(); track section.id) {
    <section class="focus">
      <h2 class="focus-label">Geöffneter Inhalt</h2>

      <button class="focus-card" (click)="navigation.go(cardTarget(section))"
              [disabled]="cardDisabled(section)"
              [attr.title]="contentTitle()">
        <span class="fc-tile">
          @if (contentPreview(); as preview) {
            <img class="fc-thumb" [class.is-icon]="preview.isIcon" [src]="preview.url" alt=""
                 (error)="dropBrokenPreview(preview.url)" />
          } @else {
            <span class="fc-icon" [innerHTML]="icons.icon(section.id)"></span>
          }
        </span>

        <span class="fc-main">
          <!-- Named by the content once there is one; else the section's label reports the state. -->
          <span class="fc-title">{{ contentTitle() ?? section.label }}</span>
          <!-- A curated content that has no node yet looks like any other here — hence said outright
               (see MenuComponent.unsaved). -->
          @if (unsaved()) {
            <span class="fc-state">Noch nicht gespeichert</span>
          }
          <!-- Without a content the card reports the state, so the line under it is the reason
               there is none (see entryDescription). -->
          @if (!contentTitle()) {
            <span class="fc-desc">{{ entryDescription(section) }}</span>
          }
        </span>

        @if (section.loading) {
          <span class="fc-spinner" aria-hidden="true"></span>
        }
      </button>
    </section>
  }

  <ul class="menu-list">
    @for (section of rowSections(); track section.id) {
      <li>
        <!-- A section that does not apply right now stays listed and disabled, and its description
             line says why (e.g. "Inhalt erschließen" for a page whose content is already in the
             repository) — see AppSection.enabled and entryDescription. -->
        <button class="menu-item" (click)="navigation.go(section.id)"
                [disabled]="section.disabled">
          <span class="mi-icon" [innerHTML]="icons.icon(section.id)"></span>
          <span class="mi-main">
            <span class="mi-title">
              {{ section.label }}
              @if (section.id === 'history' && history.entries().length) {
                <span class="mi-count">{{ history.entries().length }}</span>
              }
            </span>
            <span class="mi-desc">{{ entryDescription(section) }}</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </button>
      </li>
    }
  </ul>
</div>
