@if (visible()) {
  <footer class="user-bar">
    <!-- The whole row is the control, not just the chevron: one target, and a 20px hit area at the
         panel's far edge is the hardest thing on screen to hit. -->
    <!-- Disabled while a write is in flight: what this row folds out ends the session the save's
         follow-up requests run under (see BusyService). -->
    <button class="ub-row" (click)="toggle()" [attr.aria-expanded]="expanded()"
            [class.is-ending]="endingSoon()"
            [disabled]="busy.busy()" [title]="busy.hint() ?? hint()">
      <i class="ub-avatar" esIcon="person"></i>
      <span class="ub-main">
        <span class="ub-title">{{ title() }}</span>
        <span class="ub-name">{{ subtitle() }}</span>
      </span>
      <i class="ub-chevron" [class.is-open]="expanded()" esIcon="expand_more"></i>
    </button>

    <!-- What the row folds out is what can be done about the session it names: end it, or sign in. -->
    @if (expanded()) {
      <div class="ub-panel">
        @if (guest()) {
          <button class="ub-action" (click)="login()">Anmelden</button>
        } @else {
          <!-- The repository drops a session nothing is asked of; the row above carries the same
               countdown once it is short. -->
          @if (sessionHint(); as sessionHint) {
            <p class="ub-session">{{ sessionHint }}</p>
          }
          <button class="ub-action" (click)="logout()">Abmelden</button>
        }
      </div>
    }
  </footer>
}
