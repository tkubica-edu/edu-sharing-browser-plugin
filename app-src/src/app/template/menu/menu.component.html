<div class="menu">
  <!-- The panel's centre as its own group: a heading, and a card showing the content — its picture and
       title, or what the recognition reports instead (see AppSection.focal). The card is the shared
       one; pressing it opens the Inhaltsoptionen, which show it again as "Gewählter Inhalt".
       For a page the repository does not hold it is the offer to curate that page instead, and leads
       there — see newContent. -->
  @for (section of focalSections(); track section.id) {
    <es-content-card heading="Geöffneter Inhalt"
                     [fallbackTitle]="cardTitle(section)"
                     [note]="cardNote(section)"
                     [description]="entryDescription(section)"
                     [action]="cardAction(section)"
                     [icon]="cardIcon(section)"
                     [loading]="section.loading"
                     [interactive]="true"
                     [disabled]="cardDisabled(section)"
                     (activate)="activateCard(section)" />
  }

  <ul class="menu-list">
    @for (section of rowSections(); track section.id) {
      <li>
        <!-- A section that does not apply right now stays listed and disabled, and its description
             line says why (e.g. "Inhalt erschließen" for a page whose content is already in the
             repository) — see AppSection.enabled and entryDescription. -->
        <button class="menu-item" (click)="navigation.go(section.id)"
                [disabled]="section.disabled">
          <!-- Every section listed in the menu is named in OptionIconService.material; a new one has
               to be added there to carry an icon here. -->
          @if (icons.material(section.id); as glyph) {
            <i class="mi-icon" [esIcon]="glyph"></i>
          }
          <span class="mi-main">
            <span class="mi-title">
              {{ section.label }}
              @if (section.id === 'history' && history.entries().length) {
                <span class="mi-count">{{ history.entries().length }}</span>
              }
            </span>
            <span class="mi-desc">{{ entryDescription(section) }}</span>
          </span>
          <i class="chevron" esIcon="chevron_right"></i>
        </button>
      </li>
    }
  </ul>
</div>
