<rect width="1560" height="1508" fill="#ffffff"/>
<text x="60" y="58" font-size="30" font-weight="bold" fill="#123359">„Inhalt erschließen“ — welche Screens erscheinen</text>
<text x="60" y="86" font-size="14" fill="#5b616b">Derselbe Weg in beiden Kontexten. Die Kästen tragen die Titel, unter denen der Screen im Panel steht.</text>
<rect x="60" y="110" width="26" height="16" fill="#eeeeee" stroke="#666666"/>
<text x="94" y="123" font-size="13" fill="#1b1b1f">in beiden Kontexten gleich</text>
<rect x="332" y="110" width="26" height="16" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="366" y="123" font-size="13" fill="#1b1b1f">nur hier, oder hier anders</text>
<rect x="604" y="110" width="26" height="16" fill="#fbfbfc" stroke="#b4bac2" stroke-dasharray="4 3"/>
<text x="638" y="123" font-size="13" fill="#1b1b1f">Schritt entfällt</text>
