<!DOCTYPE html>
<html lang="de" xml:lang="de" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <base href="/edu-sharing/web-components/app/"/>
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png"/>
    <meta name="theme-color" content="#48708e"/>
    <meta charset="utf-8"/>
    <title>edu-sharing</title>
    <script>
      // Provide the backend URL for edu-sharing.
      //
      // For testing with development builds use '/edu-sharing/rest' for a proxy to the URL
      // configured the `.env` file.
      //
      window.__env = {
        EDU_SHARING_API_URL: '/edu-sharing/rest',
      };
    </script>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1"/>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico"/>
    <link rel="stylesheet" href="styles.css"/>
    <script>
      function onSubmit(event) {
        event.preventDefault();
        const data = new FormData(event.target);
        const searchString = data.get('searchString');
        console.log('submit', searchString);
        const eduSharingApp = document.getElementsByTagName('edu-sharing-app')[0];
        eduSharingApp.setAttribute('search-string', searchString);
      }
    </script>
    <style>
      body {
        padding: 20px 100px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .main-container {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .search-form {
        flex-shrink: 0;
      }
      edu-sharing-app {
        flex-grow: 1;
      }
      /* The embedded search fills the box the embedder gives it and scrolls internally. */
      edu-sharing-search {
        display: block;
        height: 700px;
        border: 1px solid #ccc;
      }
      /* The usages preview grows with its content. */
      edu-sharing-usages {
        display: block;
        border: 1px solid #ccc;
        padding: 20px;
      }
    </style>
    <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="styles.css"></head>
  <body>
    <h1>Web Components Example</h1>
    <main class="main-container">
      <h2>Search/App Example</h2>
      <form class="search-form" onsubmit="onSubmit(event)">
        <input name="searchString" class="search-input" type="text" placeholder="Search"/>
      </form>
      <edu-sharing-app></edu-sharing-app>
    </main>
    <main class="main-container">
      <h2>Search Example (search + metadata filters, no router)</h2>
      <!-- filter ids are the mds widget ids, same as in the search page's `filters` parameter -->
      <edu-sharing-search content-type="FILES" sort-properties="score" sort-ascending="false" initial-values="{&quot;cclom:general_keyword&quot;:[&quot;Bremen, Hansestadt&quot;]}"></edu-sharing-search>
      <script>
        const search = document.getElementsByTagName('edu-sharing-search')[0];
        ['nodeClicked', 'nodeActivated', 'totalResults'].forEach((name) =>
          search.addEventListener(name, (event) => console.log(name, event.detail)),
        );
        // remember the last query and restore it later via the two inputs
        let lastSearch;
        search.addEventListener('searchParametersChange', (event) => (lastSearch = event.detail));
        function restoreLastSearch() {
          search.searchString = lastSearch.searchString;
          search.initialValues = lastSearch.filters;
        }
      </script>
    </main>
    <main class="main-container">
      <h2>Usages Example (statistics for one or more nodes)</h2>
      <edu-sharing-usages></edu-sharing-usages>
      <script>
        // the element takes resolved nodes – set them as a DOM property
        fetch(
          window.__env.EDU_SHARING_API_URL +
            '/node/v1/nodes/-home-/4940d5da-9b21-4ec0-8824-d16e0409e629/metadata',
          { headers: { Accept: 'application/json' }, credentials: 'include' },
        )
          .then((response) => response.json())
          .then(({ node }) => {
            document.getElementsByTagName('edu-sharing-usages')[0].nodes = [node];
          });
      </script>
    </main>
    <main class="main-container">
      <h2>Spinner Example</h2>
      <edu-sharing-spinner></edu-sharing-spinner>
    </main>
    <main class="main-container">
      <h2>Generic Widget Example</h2>
      <edu-sharing-generic-widget context-node-id="4940d5da-9b21-4ec0-8824-d16e0409e629" widget-type="content-teaser"></edu-sharing-generic-widget>
    </main>
    <main class="main-container">
      <h2>Topic Page Example</h2>
      <edu-sharing-topic-page collection-id="4940d5da-9b21-4ec0-8824-d16e0409e629"></edu-sharing-topic-page>
    </main>
    <main class="main-container">
      <h2>Actionbar Example</h2>
      <edu-sharing-actionbar></edu-sharing-actionbar>
      <script>
        setTimeout(() => {
          document.getElementsByTagName('edu-sharing-actionbar')[0].options = [
            { name: 'HELP', icon: 'help_outline', callback: () => alert('HELP') },
            { name: 'INFO', icon: 'info', callback: () => alert('INFO') },
            { name: 'HOME', icon: 'home', callback: () => alert('HOME') },
          ];
          console.log(document.getElementsByTagName('edu-sharing-actionbar')[0]);
        }, 1000);
      </script>
    </main>
