name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Only the release job is granted the write it needs, so
# the job that runs the whole npm dependency tree cannot touch the repository.
permissions:
  contents: read

jobs:
  # The sidebar's unit tests need neither the root deps nor a browser: Vitest in
  # jsdom, every outbound call faked (see app-src/src/testing/). Its own job, so
  # the result is a separate check that does not wait for the packaging, and runs
  # alongside the build rather than in front of it.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app-src/package-lock.json

      # The --prefix form picks up app-src/.npmrc, which sets legacy-peer-deps
      # for ngx-edu-sharing-api.
      - name: Install sidebar dependencies
        run: npm ci --prefix app-src

      - name: Test sidebar services
        run: npm --prefix app-src run test

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app-src/package-lock.json

      # Root deps (archiver, web-ext) and the Angular app deps are separate
      # projects with their own lockfiles. The --prefix form also picks up
      # app-src/.npmrc, which sets legacy-peer-deps for ngx-edu-sharing-api.
      - name: Install root dependencies
        run: npm ci

      - name: Install sidebar dependencies
        run: npm ci --prefix app-src

      # Called directly rather than via `npm run build`, which would re-run an
      # unpinned `npm install` in app-src on top of the lockfile install above.
      - name: Build all targets
        run: node scripts/build.mjs --target=all

      # The build script zips chrome and firefox but deliberately skips safari,
      # since that target is meant to be fed to safari-web-extension-converter.
      # Zipped from inside the directory so the contents sit at the archive
      # root, matching the layout of the other two zips.
      - name: Zip Safari build
        run: cd dist/safari && zip -qr ../safari.zip .

      - name: Lint Firefox build
        run: npm run lint:firefox
        continue-on-error: true

      - name: Upload Chrome build
        uses: actions/upload-artifact@v7
        with:
          name: edu-sharing-chrome
          path: dist/chrome

      - name: Upload Firefox build
        uses: actions/upload-artifact@v7
        with:
          name: edu-sharing-firefox
          path: dist/firefox

      - name: Upload Safari build
        uses: actions/upload-artifact@v7
        with:
          name: edu-sharing-safari
          path: dist/safari

      # Named here, where the checkout can compare the tag against the manifest;
      # the release job publishes exactly these files.
      - name: Name release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r .version manifest.base.json)"
          if [ "$version" != "$manifest_version" ]; then
            echo "::warning::Tag version $version does not match manifest.base.json version $manifest_version"
          fi
          mkdir -p release
          for target in chrome firefox safari; do
            cp "dist/$target.zip" "release/edu-sharing-$target-$version.zip"
          done

      # Handover to the release job. The files are already compressed, so the
      # action must not zip them a second time.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: edu-sharing-release-zips
          path: release
          compression-level: 0

  # Needs no checkout and no install: the assets come from the build job, the
  # notes are written here, and gh is preinstalled on the runner.
  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: edu-sharing-release-zips
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Downloads

          | File | Browser | Installation |
          | --- | --- | --- |
          | `edu-sharing-chrome-*.zip` | Chrome, Edge | Unzip, then `chrome://extensions` → enable *Developer mode* → *Load unpacked* → select the folder. |
          | `edu-sharing-firefox-*.zip` | Firefox 128+ | Unzip, then `about:debugging` → *This Firefox* → *Load Temporary Add-on* → select `manifest.json`. |
          | `edu-sharing-safari-*.zip` | Safari | Unzip, run `xcrun safari-web-extension-converter <folder>` on macOS, then build the generated Xcode project. |
          | `edu-sharing-safari-*.zip` | Safari (no Xcode) | Unzip, then *Settings* → *Advanced* → tick **Show features for web developers** (that is what reveals the *Developer* tab) → *Developer* → *Extensions* → tick **Allow unsigned extensions** → **Add Temporary Extension…** → select the folder. Holds until Safari is restarted. |
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            release/*.zip
